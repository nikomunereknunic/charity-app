<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – přehled plateb ⚡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c;
    --bg-card: #1c2128;
    --border: #2a313c;
    --orange: #f7931a;
    --yellow: #ffd23f;
    --text: #ededed;
    --text-muted: #8b92a0;
    --success: #3ddc97;
    --danger: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    margin: 0 0 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .bolt { color: var(--orange); }
  h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    margin: 32px 0 12px;
  }

  .login-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    max-width: 340px;
  }
  .login-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .login-box button, .logout-btn, .primary-btn {
    width: 100%;
    background: var(--orange);
    color: #14171c;
    border: none;
    border-radius: 10px;
    padding: 12px 0;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 16px; }
  .success-msg { color: var(--success); font-size: 13px; margin-bottom: 10px; min-height: 16px; }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }
  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .summary-card .label { color: var(--text-muted); font-size: 12px; margin-bottom: 6px; }
  .summary-card .value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 18px;
    color: var(--yellow);
  }
  .summary-card.total .value { color: var(--success); }

  .reset-note {
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 24px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    font-size: 13px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
  }
  td.amount { font-family: 'JetBrains Mono', monospace; color: var(--yellow); }
  tr:last-child td { border-bottom: none; }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .tag.app { background: rgba(61, 220, 151, 0.15); color: var(--success); }
  .tag.other { background: rgba(247, 147, 26, 0.15); color: var(--orange); }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 12px;
  }
  .logout-btn { width: auto; padding: 8px 14px; font-size: 13px; }

  .empty { color: var(--text-muted); padding: 20px 0; font-size: 14px; }
  .hidden { display: none; }

  .manual-form {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 32px;
  }
  .manual-form label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  .manual-form select,
  .manual-form input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
  }
  .manual-form .primary-btn { margin-top: 16px; }
</style>
</head>
<body>

<div class="wrap">
  <h1><span class="bolt">⚡</span> Přehled plateb</h1>

  <div class="login-box" id="login-box">
    <p class="error" id="login-error"></p>
    <input type="password" id="password" placeholder="Admin heslo" onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()">Přihlásit se</button>
  </div>

  <div id="dashboard" class="hidden">
    <div class="top-bar">
      <span style="color: var(--text-muted); font-size: 13px;" id="last-updated"></span>
      <button class="logout-btn" onclick="logout()">Odhlásit</button>
    </div>

    <div class="summary" id="summary"></div>
    <p class="reset-note">Počítadla kategorií se automaticky vynulují na začátku každého kalendářního měsíce. Historie plateb níže zůstává zachovaná napořád.</p>

    <h2>Zapsat dar z jiného zdroje (např. Geyser Fund)</h2>
    <div class="manual-form">
      <p class="error" id="manual-error"></p>
      <p class="success-msg" id="manual-success"></p>

      <label for="manual-need">Kategorie</label>
      <select id="manual-need"></select>

      <label for="manual-amount">Částka (sat)</label>
      <input type="number" id="manual-amount" placeholder="např. 21000">

      <label for="manual-source">Zdroj</label>
      <input type="text" id="manual-source" placeholder="např. Geyser Fund" value="Geyser Fund">

      <label for="manual-note">Poznámka (volitelné)</label>
      <input type="text" id="manual-note" placeholder="např. datum sesouhlasení, poznámka k platbě">

      <button class="primary-btn" onclick="submitManualEntry()">Zapsat dar</button>
    </div>

    <h2>Historie plateb</h2>
    <table id="table">
      <thead>
        <tr><th>Datum</th><th>Kategorie</th><th>Zdroj</th><th>Částka (sat)</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<script>
let currentNeeds = [];

function fmt(n) { return Number(n).toLocaleString('cs-CZ'); }

async function login() {
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';
  try {
    const res = await fetch('/api/admin/invoices', {
      headers: { 'x-admin-password': password }
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Přihlášení se nezdařilo.';
      return;
    }
    sessionStorage.setItem('adminPassword', password);
    await showDashboard(data.data);
  } catch (e) {
    errorEl.textContent = 'Chyba připojení, zkuste to znovu.';
  }
}

function logout() {
  sessionStorage.removeItem('adminPassword');
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('login-box').classList.remove('hidden');
  document.getElementById('password').value = '';
}

async function showDashboard(invoices) {
  document.getElementById('login-box').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('last-updated').textContent =
    'Aktualizováno ' + new Date().toLocaleString('cs-CZ');
  renderSummary(invoices);
  renderTable(invoices);
  await loadNeedsIntoSelect();
}

function renderSummary(invoices) {
  const totals = {};
  let grandTotal = 0;
  invoices.forEach(inv => {
    totals[inv.title] = (totals[inv.title] || 0) + inv.amount;
    grandTotal += inv.amount;
  });
  const el = document.getElementById('summary');
  const cards = Object.entries(totals).map(([title, sum]) => `
    <div class="summary-card">
      <div class="label">${escapeHtml(title)}</div>
      <div class="value">${fmt(sum)}</div>
    </div>
  `).join('');
  el.innerHTML = cards + `
    <div class="summary-card total">
      <div class="label">Celkem přijato</div>
      <div class="value">${fmt(grandTotal)}</div>
    </div>
  `;
}

function renderTable(invoices) {
  const body = document.getElementById('table-body');
  if (!invoices.length) {
    body.innerHTML = '<tr><td colspan="4" class="empty">Zatím žádné potvrzené platby.</td></tr>';
    return;
  }
  body.innerHTML = invoices.map(inv => {
    const isApp = inv.source === 'app';
    const tagClass = isApp ? 'app' : 'other';
    const tagLabel = isApp ? 'appka' : escapeHtml(inv.source || 'jiné');
    return `
    <tr>
      <td>${new Date(inv.created_at).toLocaleString('cs-CZ')}</td>
      <td>${escapeHtml(inv.title)}</td>
      <td><span class="tag ${tagClass}">${tagLabel}</span>${inv.note ? '<br><span style="color:var(--text-muted);font-size:11px;">' + escapeHtml(inv.note) + '</span>' : ''}</td>
      <td class="amount">${fmt(inv.amount)}</td>
    </tr>
  `;
  }).join('');
}

async function loadNeedsIntoSelect() {
  try {
    const res = await fetch('/api/needs');
    const json = await res.json();
    currentNeeds = json.data || [];
    const select = document.getElementById('manual-need');
    select.innerHTML = currentNeeds.map(n => `<option value="${n.id}">${escapeHtml(n.title)}</option>`).join('');
  } catch (e) {
    // ticho - formulář zůstane prázdný, chyba se projeví až při odeslání
  }
}

async function submitManualEntry() {
  const errorEl = document.getElementById('manual-error');
  const successEl = document.getElementById('manual-success');
  errorEl.textContent = '';
  successEl.textContent = '';

  const needId = parseInt(document.getElementById('manual-need').value, 10);
  const amount = parseInt(document.getElementById('manual-amount').value, 10);
  const source = document.getElementById('manual-source').value.trim() || 'manual';
  const note = document.getElementById('manual-note').value.trim();
  const password = sessionStorage.getItem('adminPassword');

  if (!Number.isInteger(amount) || amount <= 0) {
    errorEl.textContent = 'Zadejte platnou částku.';
    return;
  }

  try {
    const res = await fetch('/api/admin/manual-entry', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-password': password
      },
      body: JSON.stringify({ needId, amount, source, note })
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Zápis se nezdařil.';
      return;
    }
    successEl.textContent = 'Dar byl úspěšně zapsán.';
    document.getElementById('manual-amount').value = '';
    document.getElementById('manual-note').value = '';

    const refreshed = await fetch('/api/admin/invoices', { headers: { 'x-admin-password': password } });
    const refreshedData = await refreshed.json();
    if (refreshed.ok) {
      renderSummary(refreshedData.data);
      renderTable(refreshedData.data);
    }
  } catch (e) {
    errorEl.textContent = 'Chyba připojení, zkuste to znovu.';
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Auto-login if password already stored for this browser tab session
(function tryAutoLogin() {
  const stored = sessionStorage.getItem('adminPassword');
  if (!stored) return;
  document.getElementById('password').value = stored;
  login();
})();
</script>

</body>
</html>
